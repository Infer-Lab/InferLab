name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The one spelling of the just pin shared by the gate jobs.
  JUST_VERSION: "1.58.0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup natively installs the toolchain, components, and profile
      # selected by rust-toolchain.toml — the one spelling of the pin. The
      # existence check keeps a deleted pin file loud: bare rustup show would
      # silently fall back to the runner's default stable.
      - run: test -f rust-toolchain.toml && rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      # The gate composition lives in the justfile, shared with local runs
      # and the governance guard.
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just verify-rust

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # protocol-check regenerates the adapter schema through cargo; rustup
      # natively installs the toolchain selected by rust-toolchain.toml.
      - run: test -f rust-toolchain.toml && rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - run: pixi run verify-python

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just verify-website
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: [rust, python, website]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated public snapshot
        id: deployment
        uses: actions/deploy-pages@v5
