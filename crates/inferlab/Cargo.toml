[package]
name = "inferlab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reproducible LLM inference experiment harness: versioned workspaces, closed-loop serve/eval/bench recipes, runtime images, and file-first evidence."
keywords = ["llm", "inference", "benchmarking", "evaluation", "vllm"]
categories = ["command-line-utilities", "science"]
include = [
    "/src/**",
    "/resources/bench-agentic-sources.toml",
    "/resources/bench-datasets.toml",
    "/resources/eval-toolchain/pixi.lock",
    "/resources/eval-toolchain/pixi.toml",
    "/resources/plugin/**",
    "/resources/toolchain-python/**",
    "/resources/vision-smoke.png",
    "/LICENSE",
    "/build.rs",
]
readme = "../../README.md"

[dependencies]
agent-plugin-installer.workspace = true
axum.workspace = true
base16ct.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
flate2.workspace = true
form_urlencoded.workspace = true
fs2.workspace = true
inferlab-protocol = { path = "../inferlab-protocol", version = "0.19" }
inferlab-profiler = { path = "../inferlab-profiler", version = "0.19" }
inferlab-proxy = { path = "../inferlab-proxy", version = "0.19" }
inferlab-runtime = { path = "../inferlab-runtime", version = "0.19" }
inferlab-serve-domain = { path = "../inferlab-serve-domain", version = "0.19" }
humantime.workspace = true
maud.workspace = true
memchr.workspace = true
object.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde-value.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
terminal-colorsaurus.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
yaml_serde.workspace = true

[build-dependencies]
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
object = { workspace = true, features = ["write"] }
fs2.workspace = true
insta.workspace = true
serde_json.workspace = true

[lints]
workspace = true
