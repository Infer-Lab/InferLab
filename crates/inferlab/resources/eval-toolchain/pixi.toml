[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[feature.eval.dependencies]
python = "3.12.*"
pydantic = "==2.13.4"

[feature.eval.pypi-dependencies]
lm-eval = { version = "==0.4.13", extras = ["api"] }
transformers = "==5.12.1"

[feature.bench.dependencies]
python = "3.12.*"
pydantic = "==2.13.4"

[feature.bench.target.linux-aarch64.dependencies]
c-compiler = "1.*"

[feature.bench.pypi-dependencies]
aiperf = { git = "https://github.com/lucifer1004/aiperf.git", rev = "c0a951f3282335a32573ebc9c949d5b5c23e0dec" }

# Image-packaging tools ([[RFC-0007:C-IMAGE-BUILD]]): search-path rewriting,
# device-code extraction for verification, and wheel repacking.
[feature.image.dependencies]
python = "3.12.*"
patchelf = "==0.19.2"
cuda-cuobjdump = "==13.4.92"
wheel = "==0.48.0"

[environments]
eval = ["eval"]
bench = ["bench"]
image = ["image"]
