[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[feature.eval.dependencies]
python = "3.12.*"
pydantic = "==2.13.4"

[feature.eval.pypi-dependencies]
lm-eval = { version = "==0.4.13", extras = ["api"] }
transformers = "==5.12.1"

[feature.bench.dependencies]
python = "3.12.*"
pydantic = "==2.13.4"

[feature.bench.target.linux-aarch64.dependencies]
c-compiler = "1.*"

[feature.bench.pypi-dependencies]
aiperf = { git = "https://github.com/lucifer1004/aiperf.git", rev = "8f3ac49a51ff6b07b22cd5afcfd0495902106572" }

[environments]
eval = ["eval"]
bench = ["bench"]
