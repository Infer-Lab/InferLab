schema_version = 2

[models.deepseek-v4-flash]
served_name = "deepseek-v4-flash"

[models.deepseek-v4-pro]
served_name = "deepseek-v4-pro"

[stacks.vllm]
integration = "vllm"
pixi_environment = "vllm"
source_paths = ["vendor/vllm", "vendor/flashinfer"]

[[stacks.vllm.checks]]
id = "fixture-guard"
script = "tools/fixture-check.py"
repair_hint = "pixi run fixture-repair"

[[stacks.vllm.image_postprocess]]
id = "fixture-finish"
script = "tools/fixture-finish.py"

[stacks.vllm-alt]
integration = "vllm"
pixi_environment = "vllm"
source_paths = ["vendor/vllm", "vendor/flashinfer"]

[stacks.flashinfer-only]
integration = "vllm"
pixi_environment = "vllm"
source_paths = ["vendor/flashinfer"]

[servers.deepseek-v4-flash-qualify]
stack = "vllm"
model = "deepseek-v4-flash"
topology = "single"
readiness_timeout_seconds = 60
default_case = "base"

[servers.deepseek-v4-flash-qualify.roles.serve]

[servers.deepseek-v4-flash-qualify.cases.base]

[servers.deepseek-v4-flash-routed]
stack = "vllm"
model = "deepseek-v4-flash"
topology = "single"
gateway_backend = "fixture-gateway"
readiness_timeout_seconds = 60
default_case = "base"

[servers.deepseek-v4-flash-routed.roles.serve]

[servers.deepseek-v4-flash-routed.cases.base]

[servers.deepseek-v4-flashb-qualify]
stack = "vllm"
model = "deepseek-v4-pro"
topology = "single"
readiness_timeout_seconds = 60
default_case = "base"

[servers.deepseek-v4-flashb-qualify.roles.serve]

[servers.deepseek-v4-flashb-qualify.cases.base]

[servers.deepseek-v4-flash-qualify-alt-env]
stack = "vllm-alt"
model = "deepseek-v4-flash"
topology = "single"
readiness_timeout_seconds = 60
default_case = "base"

[servers.deepseek-v4-flash-qualify-alt-env.roles.serve]

[servers.deepseek-v4-flash-qualify-alt-env.cases.base]

[servers.deepseek-v4-flash-qualify-alt-sources]
stack = "flashinfer-only"
model = "deepseek-v4-flash"
topology = "single"
readiness_timeout_seconds = 60
default_case = "base"

[servers.deepseek-v4-flash-qualify-alt-sources.roles.serve]

[servers.deepseek-v4-flash-qualify-alt-sources.cases.base]

[servers.deepseek-v4-flash-pair]
stack = "vllm"
model = "deepseek-v4-flash"
topology = "single"
readiness_timeout_seconds = 60
default_case = "pair"

[servers.deepseek-v4-flash-pair.roles.serve]

[servers.deepseek-v4-flash-pair.cases.pair.parallelism.outer]
tensor_parallel_size = 2

[evals.smoke]
kind = "openai-smoke"
prompt = "San Francisco is a city in"
max_tokens = 16
timeout_seconds = 60

[benches.probe]
kind = "serving"
request_source = { kind = "random", prompt = { kind = "server_chat" }, input_tokens = 128, output_tokens = 16 }
concurrency = [1]
prompts_per_concurrency = 1
request_rates = [1.0]
request_count = 4
burstiness = 1.0
cache = { start = "uncontrolled" }
timeout_seconds = 60

[workload_suites.smoke-only]
evals = ["smoke"]
gate = "smoke"

[recipes.deepseek-v4-flash-qualify]
server = "deepseek-v4-flash-qualify"
workload_suite = "smoke-only"

[recipes.deepseek-v4-flash-routed]
server = "deepseek-v4-flash-routed"
workload_suite = "smoke-only"

[recipes.deepseek-v4-flashb-qualify]
server = "deepseek-v4-flashb-qualify"
workload_suite = "smoke-only"

[recipes.deepseek-v4-flash-qualify-alt-env]
server = "deepseek-v4-flash-qualify-alt-env"
workload_suite = "smoke-only"

[recipes.deepseek-v4-flash-qualify-alt-sources]
server = "deepseek-v4-flash-qualify-alt-sources"
workload_suite = "smoke-only"

[recipes.deepseek-v4-flash-pair]
server = "deepseek-v4-flash-pair"
workload_suite = "smoke-only"

[images.deepseek-v4-flash-runtime]
stack = "vllm"
base_image = "example.com/micromamba:1.0"
platforms = ["linux/amd64", "linux/arm64"]
packages = ["vendor/vllm", "vendor/flashinfer"]

[[images.deepseek-v4-flash-runtime.validations]]
recipe = "deepseek-v4-flash-qualify"

[[images.deepseek-v4-flash-runtime.validations]]
recipe = "deepseek-v4-flashb-qualify"

[images.deepseek-v4-flash-runtime-foreign]
stack = "vllm"
base_image = "example.com/micromamba:1.0"
platforms = ["linux/arm64"]

[images.deepseek-v4-flash-runtime-native]
stack = "vllm"
base_image = "example.com/micromamba:1.0"
platforms = ["linux/amd64"]

[[images.deepseek-v4-flash-runtime-native.validations]]
recipe = "deepseek-v4-flash-qualify"

[[images.deepseek-v4-flash-runtime-native.validations]]
recipe = "deepseek-v4-flashb-qualify"

[images.deepseek-v4-flash-runtime-bare]
stack = "vllm"
base_image = "example.com/micromamba:1.0"
platforms = ["linux/amd64"]

[images.deepseek-v4-flash-runtime-routed]
stack = "vllm"
base_image = "example.com/micromamba:1.0"
platforms = ["linux/amd64"]

[[images.deepseek-v4-flash-runtime-routed.validations]]
recipe = "deepseek-v4-flash-routed"

[external_images.fixture-external]
reference = "example.com/fixture-vllm@sha256:abababababababababababababababababababababababababababababababab"
integration = "vllm"

[external_images.fixture-foreign-stack]
reference = "example.com/fixture-sglang@sha256:cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
integration = "sglang"
