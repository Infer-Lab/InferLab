[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
datamodel-code-generator = "==0.66.0"
pydantic = "==2.13.4"
pytest = "==9.1.1"
mypy = "==2.1.0"
ruff = "0.*"
jsonschema = "==4.26.0"
types-jsonschema = "==4.26.0.20260518"
python-build = "1.*"
hatchling = ">=1.27,<2"
packaging = ">=24,<27"
uv = "0.*"

[pypi-dependencies]
inferlab-adapter-sdk = { path = "python/inferlab-adapter-sdk", editable = true }
inferlab-bench-runner = { path = "python/inferlab-bench-runner", editable = true }
inferlab-eval-runner = { path = "python/inferlab-eval-runner", editable = true }
inferlab-measurement-sdk = { path = "python/inferlab-measurement-sdk", editable = true }
inferlab-integration-sglang = { path = "python/inferlab-integration-sglang", editable = true }
inferlab-integration-specialized-engine = { path = "python/inferlab-integration-specialized-engine", editable = true }
inferlab-integration-tensorrt-llm = { path = "python/inferlab-integration-tensorrt-llm", editable = true }
inferlab-integration-tokenspeed = { path = "python/inferlab-integration-tokenspeed", editable = true }
inferlab-integration-vllm = { path = "python/inferlab-integration-vllm", editable = true }

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
protocol-generate = "scripts/protocol-codegen.sh generate"
protocol-check = "scripts/protocol-codegen.sh check"
format-python = "ruff format python crates/inferlab/tests/fixtures/bin scripts"
format-python-check = "ruff format --check python crates/inferlab/tests/fixtures/bin scripts"
lint-python = "ruff check python crates/inferlab/tests/fixtures/bin scripts"
check-fixture-shell = "sh -n crates/inferlab/tests/fixtures/bin/*.sh"
typecheck-python = "mypy python scripts"
test-python = "pytest"
test-release-versioning = "bash scripts/tests/release-versioning.sh && python -m unittest scripts/tests/test_product_release_assets.py && bash scripts/tests/product-release-finalization.sh"
build-python = "scripts/build-python-packages.sh"
verify-python = { depends-on = ["protocol-check", "format-python-check", "lint-python", "check-fixture-shell", "typecheck-python", "test-python", "test-release-versioning", "build-python"] }

[feature.website.dependencies]
nodejs = "24.*"

[feature.website.tasks]
website-install = "npm --prefix website ci"
website-sync = "npm --prefix website run sync"
website-dev = "npm --prefix website run dev -- --host 0.0.0.0"
website-check = "npm --prefix website run check"
website-build = "npm --prefix website run build"
website-verify = "npm --prefix website run verify"

[environments]
website = { features = ["website"], no-default-feature = true }
