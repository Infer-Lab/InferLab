[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["python"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "python/inferlab-adapter-sdk/src",
    "python/inferlab-eval-runner/src",
    "python/inferlab-integration-specialized-engine/src",
    "python/inferlab-integration-vllm/src",
    "python/inferlab-measurement-sdk/src",
]

# Generated protocol models assign raw schema defaults to enum-typed fields;
# correctness of the generated assignments is owned by the code generator and
# the cross-language fixture tests.
[[tool.mypy.overrides]]
module = [
    "inferlab_adapter_sdk._generated",
    "inferlab_measurement_sdk._generated",
]
disable_error_code = ["assignment"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "python/inferlab-adapter-sdk/src/inferlab_adapter_sdk/_generated.py",
    "python/inferlab-measurement-sdk/src/inferlab_measurement_sdk/_generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
