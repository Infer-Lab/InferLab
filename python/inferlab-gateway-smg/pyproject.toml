[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferlab-gateway-smg"
version = "0.3.0"
description = "Inferlab SMG frontend lowering shared by the integrations that run SMG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["inferlab-adapter-sdk==0.13.0"]

[project.urls]
Repository = "https://github.com/Infer-Lab/InferLab"

[tool.inferlab.release]
lifecycle = "workspace-side"

[tool.hatch.build.targets.wheel]
packages = ["src/inferlab_gateway_smg"]
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md"]
