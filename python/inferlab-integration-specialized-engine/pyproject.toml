[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferlab-integration-specialized-engine"
version = "0.2.2"
description = "Inferlab adapter integration for token-only Specialized Engines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["inferlab-adapter-sdk==0.6.1"]

[project.scripts]
inferlab-adapter-specialized-engine = "inferlab_integration_specialized_engine.__main__:main"

[project.urls]
Repository = "https://github.com/Infer-Lab/InferLab"

[tool.hatch.build.targets.wheel]
packages = ["src/inferlab_integration_specialized_engine"]
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md"]
